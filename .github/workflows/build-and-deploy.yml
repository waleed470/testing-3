name: Branch Processor (3 Parts Sequential)

on:
  workflow_dispatch:
  push:
    branches: [f1, f2, f3, f4, f5, f6, f7, f8, f9]

jobs:
  determine_branch:
    name: 🔍 Determine Branch
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.get_branch.outputs.branch }}
    steps:
      - name: Get Branch Name
        id: get_branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "📋 Processing branch: $BRANCH_NAME"

  process_part_1:
    name: ${{ needs.determine_branch.outputs.branch_name }} - Part 1
    runs-on: ubuntu-latest
    needs: determine_branch
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Process Part 1
        run: |
          echo "🔄 STARTING ${{ needs.determine_branch.outputs.branch_name }} - PART 1"
          sleep 8
          echo "✅ ${{ needs.determine_branch.outputs.branch_name }} - PART 1 COMPLETED"

  process_part_2:
    name: ${{ needs.determine_branch.outputs.branch_name }} - Part 2
    runs-on: ubuntu-latest
    needs: process_part_1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Process Part 2
        run: |
          echo "🔄 STARTING ${{ needs.determine_branch.outputs.branch_name }} - PART 2"
          sleep 8
          echo "✅ ${{ needs.determine_branch.outputs.branch_name }} - PART 2 COMPLETED"

  process_part_3:
    name: ${{ needs.determine_branch.outputs.branch_name }} - Part 3
    runs-on: ubuntu-latest
    needs: process_part_2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Process Part 3
        run: |
          echo "🔄 STARTING ${{ needs.determine_branch.outputs.branch_name }} - PART 3"
          sleep 8
          echo "✅ ${{ needs.determine_branch.outputs.branch_name }} - PART 3 COMPLETED"
          echo "🎉 ${{ needs.determine_branch.outputs.branch_name }} COMPLETED ALL PARTS"

  branch_completion:
    name: ✅ ${{ needs.determine_branch.outputs.branch_name }} Complete
    runs-on: ubuntu-latest
    needs: process_part_3
    steps:
      - name: Branch Processing Complete
        run: |
          echo "🎊 ${{ needs.determine_branch.outputs.branch_name }} PROCESSING COMPLETE!"
          echo "⏳ Next branch will start automatically..."