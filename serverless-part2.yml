service: test-app-part2

provider:
  name: aws
  runtime: nodejs18.x
  stage: test
  region: us-east-1

functions:
  users:
    handler: handler.users
    events:
      - http:
          path: users
          method: get

  login:
    handler: handler.login
    events:
      - http:
          path: login
          method: post